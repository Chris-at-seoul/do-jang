<style>
  :root{
    --river-deep:#0E2F36; --river-glow:#1B5964; --gold:#C99A3E; --paper:#F1E9D8;
    --ink:#1C2B2B; --ink-soft:#5B6B62; --stamp:#B3392C; --card-border:#D8C9A0;
    --font-head:'Gowun Batang','Noto Serif KR',serif;
    --font-body:'Noto Sans KR',-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --river-deep:#081C20; --river-glow:#12414A; --paper:#E7DAB8; --ink:#20302F; --card-border:#C7B587; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(1200px 500px at 50% -10%, var(--river-glow), transparent 60%), var(--river-deep);
    background-attachment:fixed;
    color:var(--paper); font-family:var(--font-body); line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh;
  }

  /* ---------- Tabs ---------- */
  .tabs-wrap{position:sticky; top:0; z-index:10; background:rgba(14,47,54,.88); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid rgba(201,154,62,.25);}
  .tabs{max-width:920px; margin:0 auto; display:flex; gap:6px; padding:10px 16px; overflow-x:auto; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto; display:flex; align-items:center; gap:8px; background:none; border:1px solid rgba(241,233,216,.22); color:rgba(241,233,216,.75); font:inherit; font-size:13.5px; font-weight:500; padding:7px 14px; border-radius:99px; cursor:pointer; transition:all .2s; white-space:nowrap;}
  .tab:hover{border-color:rgba(201,154,62,.6); color:var(--paper);}
  .tab[aria-selected="true"]{background:var(--gold); border-color:var(--gold); color:#1C2B2B;}
  .tab-count{font-size:11px; font-variant-numeric:tabular-nums; opacity:.75;}

  .page{max-width:920px; margin:0 auto; padding:40px 16px 80px;}
  .hero{text-align:center; margin-bottom:36px;}
  .hero h1{font-family:var(--font-head); font-weight:700; font-size:clamp(28px,6vw,42px); margin:0 0 10px;}
  .hero .lede{color:rgba(241,233,216,.78); font-size:15px; max-width:440px; margin:0 auto 28px;}
  .celebrate{display:none; margin:0 auto 20px; max-width:440px; background:rgba(201,154,62,.15); border:1px solid var(--gold); color:var(--gold); border-radius:10px; padding:10px 16px; font-size:14px; font-weight:500;}
  .celebrate.show{display:block;}
  .progress-wrap{max-width:360px; margin:0 auto 24px;}
  .progress-track{height:8px; border-radius:99px; background:rgba(241,233,216,.14); overflow:hidden;}
  .progress-fill{height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,var(--river-glow),var(--gold)); transition:width .45s ease;}
  .progress-label{margin:8px 0 0; font-size:13px; color:rgba(241,233,216,.7); font-variant-numeric:tabular-nums;}
  .bead-row{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; max-width:560px; margin:0 auto;}
  .bead{width:11px; height:11px; border-radius:50%; background:rgba(241,233,216,.2); border:1.5px solid rgba(241,233,216,.35); transition:all .3s;}
  .bead.done{background:var(--gold); border-color:var(--gold); transform:scale(1.15);}
  .sync-status{margin:12px 0 0; font-size:11.5px; color:rgba(241,233,216,.45);}

  /* ---------- Lock ---------- */
  .lock{margin-top:18px; display:flex; flex-direction:column; align-items:center; gap:8px;}
  .lock-btn{background:none; border:1px solid rgba(241,233,216,.3); color:rgba(241,233,216,.8); font:inherit; font-size:12.5px; padding:6px 14px; border-radius:99px; cursor:pointer;}
  .lock-btn.open{border-color:var(--gold); color:var(--gold);}
  .pin-form{display:none; gap:6px; align-items:center;}
  .pin-form.show{display:flex;}
  .pin-form input{width:120px; text-align:center; letter-spacing:.3em; background:rgba(241,233,216,.08); border:1px solid rgba(241,233,216,.3); color:var(--paper); border-radius:6px; padding:6px 8px; font:inherit;}
  .pin-form input:focus{outline:none; border-color:var(--gold);}
  .btn{background:var(--gold); color:#1C2B2B; border:none; font:inherit; font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:6px; cursor:pointer;}
  .btn:disabled{opacity:.5; cursor:default;}
  .lock-msg{font-size:12px; color:#E8A598; min-height:1em; margin:0;}

  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:#1C2B2B; color:var(--paper); border:1px solid rgba(201,154,62,.5); padding:10px 16px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:all .25s; z-index:20; max-width:calc(100% - 32px); text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- Cards ---------- */
  .region-block{margin-top:38px;}
  .region-title{display:flex; justify-content:space-between; font-weight:700; font-size:13px; color:var(--gold); margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid rgba(201,154,62,.3);}
  .region-title span{font-weight:500; opacity:.7; font-variant-numeric:tabular-nums;}
  .card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  .card-wrap{position:relative;}
  .card{position:relative; width:100%; height:100%; text-align:left; background:var(--paper); color:var(--ink); border:1.5px dashed var(--card-border); border-radius:6px; padding:16px 16px 14px; cursor:pointer; font-family:inherit; overflow:hidden; transition:transform .15s, box-shadow .2s; -webkit-tap-highlight-color:transparent; min-height:96px;}
  .card:hover{transform:translateY(-2px);}
  .card:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .card.is-visited{border-style:solid; box-shadow:0 6px 18px rgba(0,0,0,.25);}
  .card-index{font-size:11px; font-weight:700; color:var(--ink-soft); letter-spacing:.04em;}
  .card-added{font-size:10px; font-weight:500; color:var(--ink-soft); margin-left:6px; border:1px solid var(--card-border); border-radius:4px; padding:0 4px;}
  .card-name{display:block; font-family:var(--font-head); font-size:19px; font-weight:700; margin:2px 0 1px; padding-right:4px;}
  .card-en{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:8px;}
  .card-note{display:block; font-size:13px; opacity:.85; line-height:1.45; padding-right:4px;}
  .card-hint{display:block; margin-top:10px; font-size:12px; color:var(--ink-soft);}
  .card.is-visited .card-hint{display:none;}
  .card.is-visited .card-name,.card.is-visited .card-note{padding-right:78px;}
  .del{display:none; position:absolute; bottom:8px; right:8px; background:none; border:1px solid rgba(179,57,44,.4); color:var(--stamp); font:inherit; font-size:11px; padding:2px 8px; border-radius:99px; cursor:pointer; z-index:2;}
  body.unlocked .del{display:block;}
  .del.confirming{background:var(--stamp); color:#fff;}
  .stamp{display:none; position:absolute; top:14px; right:14px; width:74px; height:74px; border-radius:50%; border:2.5px double var(--stamp); color:var(--stamp); transform:rotate(-11deg); align-items:center; justify-content:center; flex-direction:column; text-align:center; mix-blend-mode:multiply;}
  .card.is-visited .stamp{display:flex;}
  .stamp-word{font-family:var(--font-head); font-weight:700; font-size:15px; line-height:1.1;}
  .stamp-date{font-size:8.5px; margin-top:2px;}
  .stamp-by{font-size:10px; margin-top:1px; line-height:1;}
  @keyframes stampDown{0%{transform:rotate(-11deg) scale(2.4);opacity:0}60%{transform:rotate(-11deg) scale(.92);opacity:1}100%{transform:rotate(-11deg) scale(1);opacity:1}}
  .stamp.pop{animation:stampDown .32s ease-out;}

  /* ---------- Add place ---------- */
  .add-box{display:none; margin-top:38px; border:1.5px dashed rgba(201,154,62,.5); border-radius:8px; padding:16px;}
  body.unlocked .add-box{display:block;}
  .add-box h3{margin:0 0 12px; font-size:13px; color:var(--gold);}
  .add-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .add-grid input{width:100%; background:rgba(241,233,216,.08); border:1px solid rgba(241,233,216,.25); color:var(--paper); border-radius:6px; padding:8px 10px; font:inherit; font-size:14px;}
  .add-grid input:focus{outline:none; border-color:var(--gold);}
  .add-grid .full{grid-column:1 / -1;}
  .add-row{display:flex; justify-content:flex-end; margin-top:10px;}

  footer{margin-top:48px; text-align:center;}
  .reset-btn{display:none; background:none; border:1px solid rgba(241,233,216,.3); color:rgba(241,233,216,.6); font:inherit; font-size:12.5px; padding:9px 16px; border-radius:99px; cursor:pointer;}
  body.unlocked .reset-btn{display:inline-block;}
  .reset-btn:hover,.reset-btn.confirming{border-color:var(--stamp); color:var(--stamp);}
  @media (max-width:420px){
    .card-grid{grid-template-columns:1fr;}
    .stamp{width:64px;height:64px;top:12px;right:12px;}
    .card.is-visited .card-name,.card.is-visited .card-note{padding-right:68px;}
    .add-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<nav class="tabs-wrap"><div class="tabs" id="tabs" role="tablist"></div></nav>
<div class="page">
  <header class="hero">
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <p class="celebrate" id="celebrate"></p>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <p class="progress-label" id="progressLabel"></p>
    </div>
    <div class="bead-row" id="beadRow"></div>
    <div class="lock">
      <button class="lock-btn" id="lockBtn" type="button">🔒 잠김 · PIN으로 열기</button>
      <form class="pin-form" id="pinForm" autocomplete="off">
        <input id="pinInput" type="password" inputmode="numeric" maxlength="20" placeholder="PIN" aria-label="PIN">
        <button class="btn" type="submit">열기</button>
      </form>
      <p class="lock-msg" id="lockMsg"></p>
    </div>
    <p class="sync-status" id="syncStatus"></p>
  </header>
  <main id="main"></main>
  <section class="add-box" id="addBox">
    <h3>+ 이 탭에 장소 추가</h3>
    <form id="addForm" autocomplete="off">
      <div class="add-grid">
        <input id="addName" maxlength="40" placeholder="장소 이름 (필수)" required>
        <input id="addRegion" maxlength="30" placeholder="지역 묶음 (필수)" list="regionList" required>
        <input id="addNote" class="full" maxlength="80" placeholder="한 줄 메모 (선택)">
      </div>
      <datalist id="regionList"></datalist>
      <div class="add-row"><button class="btn" id="addBtn" type="submit">추가</button></div>
    </form>
  </section>
  <footer><button class="reset-btn" id="resetBtn" type="button">이 탭 기록 초기화</button></footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var COLS = window.COLLECTIONS;
  var LS_TAB='dojang-tab', LS_PIN='dojang-pin';
  var STAMP_SIGN='🐻♥️🐰';
  var cfg = window.DOJANG_CONFIG || {};
  var sb = null;
  var state = {};      // { item_id: {date} }
  var places = [];     // 이용자가 추가한 장소 (DB)
  var cur = null;
  var pin = null;      // 잠금 해제 시 PIN

  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
  function today(){ var d=new Date(); return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  var $ = function(id){ return document.getElementById(id); };
  var tabsEl=$('tabs'), main=$('main'), beadRow=$('beadRow');

  var toastTimer=null;
  function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('show'); },2600); }

  var ERR = {
    bad_pin:'PIN이 틀렸어요.',
    locked:'PIN을 여러 번 틀려서 10분간 잠겼어요.',
    no_pin:'아직 PIN이 설정되지 않았어요.',
    invalid:'입력값을 확인해 주세요.',
    offline:'서버에 연결되지 않아 지금은 바꿀 수 없어요.'
  };

  function itemsOf(col){
    var extra = places.filter(function(p){ return p.collection===col.id; })
      .map(function(p){ return {id:p.id, name:p.name, region:p.region, note:p.note, added:true}; });
    return col.items.concat(extra);
  }
  function countDone(col){ return itemsOf(col).filter(function(it){ return state[it.id]; }).length; }

  // ---------- tabs ----------
  COLS.forEach(function(col){
    var t=document.createElement('button');
    t.className='tab'; t.type='button'; t.setAttribute('role','tab'); t.dataset.col=col.id;
    t.innerHTML=esc(col.tab)+'<span class="tab-count"></span>';
    t.addEventListener('click', function(){ select(col.id, true); });
    tabsEl.appendChild(t);
  });

  function select(id, userAction){
    cur = COLS.filter(function(c){ return c.id===id; })[0] || COLS[0];
    lsSet(LS_TAB, cur.id);
    if(location.hash !== '#'+cur.id) history.replaceState(null,'','#'+cur.id);
    document.title = cur.title;
    tabsEl.querySelectorAll('.tab').forEach(function(t){
      var on = t.dataset.col===cur.id; t.setAttribute('aria-selected', on?'true':'false');
      if(on && userAction) t.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
    });
    buildPanel(); render();
    if(userAction) window.scrollTo({top:0});
  }

  function buildPanel(){
    $('title').textContent = cur.title;
    $('lede').textContent = cur.lede || '';
    $('celebrate').textContent = cur.done || '🎉 완주!';
    main.innerHTML=''; beadRow.innerHTML='';
    var items=itemsOf(cur), order=[], groups={};
    items.forEach(function(it){ if(!groups[it.region]){ groups[it.region]=[]; order.push(it.region); } groups[it.region].push(it); });
    var idx=0;
    order.forEach(function(region){
      var sec=document.createElement('section'); sec.className='region-block';
      var h=document.createElement('h2'); h.className='region-title'; h.dataset.region=region;
      h.innerHTML=esc(region)+'<span></span>';
      var grid=document.createElement('div'); grid.className='card-grid';
      sec.appendChild(h); sec.appendChild(grid); main.appendChild(sec);
      groups[region].forEach(function(it){
        idx++;
        var w=document.createElement('div'); w.className='card-wrap';
        w.innerHTML='<button class="card" type="button" data-id="'+esc(it.id)+'" aria-pressed="false">'+
          '<span class="card-index">'+String(idx).padStart(2,'0')+(it.added?'<span class="card-added">추가됨</span>':'')+'</span>'+
          '<span class="card-name">'+esc(it.name)+'</span>'+
          (it.en?'<span class="card-en">'+esc(it.en)+'</span>':'')+
          (it.note?'<span class="card-note">'+esc(it.note)+'</span>':'')+
          '<span class="card-hint">탭하여 도장 찍기</span>'+
          '<span class="stamp"><span class="stamp-word">방문완료</span><span class="stamp-date"></span><span class="stamp-by">'+STAMP_SIGN+'</span></span>'+
          '</button>'+
          (it.added?'<button class="del" type="button" data-del="'+esc(it.id)+'">삭제</button>':'');
        grid.appendChild(w);
        var bead=document.createElement('span'); bead.className='bead'; bead.dataset.id=it.id; beadRow.appendChild(bead);
      });
    });
    $('regionList').innerHTML = order.map(function(r){ return '<option value="'+esc(r)+'">'; }).join('');
  }

  function render(){
    COLS.forEach(function(col){
      var el=tabsEl.querySelector('[data-col="'+col.id+'"] .tab-count');
      if(el) el.textContent=countDone(col)+'/'+itemsOf(col).length;
    });
    if(!cur) return;
    var items=itemsOf(cur), n=0, per={};
    items.forEach(function(it){
      var v=state[it.id];
      per[it.region]=per[it.region]||[0,0]; per[it.region][1]++;
      if(v){ n++; per[it.region][0]++; }
      var card=main.querySelector('.card[data-id="'+CSS.escape(it.id)+'"]'), bead=beadRow.querySelector('.bead[data-id="'+CSS.escape(it.id)+'"]');
      if(card){
        card.classList.toggle('is-visited',!!v); card.setAttribute('aria-pressed',v?'true':'false');
        if(v) card.querySelector('.stamp-date').textContent=v.date||'';
      }
      if(bead) bead.classList.toggle('done',!!v);
    });
    main.querySelectorAll('.region-title').forEach(function(h){
      var r=per[h.dataset.region]||[0,0]; h.querySelector('span').textContent=r[0]+' / '+r[1];
    });
    var total=items.length;
    $('progressFill').style.width=(total? n/total*100 : 0)+'%';
    $('progressLabel').textContent=n+' / '+total+' 완료';
    $('celebrate').classList.toggle('show', total>0 && n===total);
  }

  // ---------- server ----------
  async function rpc(fn, args){
    if(!sb) return 'offline';
    var r = await sb.rpc(fn, args);
    if(r.error){ console.error(r.error); return 'error'; }
    return r.data;
  }
  async function loadAll(){
    var a=await sb.from('visits').select('park_id,date');
    var b=await sb.from('places').select('id,collection,name,region,note,created_at').order('created_at');
    if(a.error) throw a.error; if(b.error) throw b.error;
    var s={}; (a.data||[]).forEach(function(row){ s[row.park_id]={date:row.date}; });
    state=s; places=b.data||[];
  }
  function handleFail(code){
    if(code==='bad_pin' || code==='no_pin'){ setLocked(); }
    toast(ERR[code] || '저장에 실패했어요. 잠시 후 다시 시도해 주세요.');
  }

  // ---------- lock ----------
  function setUnlocked(p){
    pin=p; lsSet(LS_PIN,p); document.body.classList.add('unlocked');
    $('lockBtn').textContent='🔓 편집 가능 · 잠그기'; $('lockBtn').classList.add('open');
    $('pinForm').classList.remove('show'); $('lockMsg').textContent='';
  }
  function setLocked(){
    pin=null; lsDel(LS_PIN); document.body.classList.remove('unlocked');
    $('lockBtn').textContent='🔒 잠김 · PIN으로 열기'; $('lockBtn').classList.remove('open');
  }
  $('lockBtn').addEventListener('click', function(){
    if(pin){ setLocked(); toast('잠갔어요'); return; }
    $('pinForm').classList.toggle('show');
    if($('pinForm').classList.contains('show')) $('pinInput').focus();
  });
  $('pinForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var p=$('pinInput').value.trim(); if(!p) return;
    var r=await rpc('dojang_verify',{p_pin:p});
    $('pinInput').value='';
    if(r==='ok'){ setUnlocked(p); toast('잠금 해제! 도장을 찍을 수 있어요'); }
    else $('lockMsg').textContent = ERR[r] || '확인에 실패했어요.';
  });

  // ---------- stamp ----------
  main.addEventListener('click', async function(e){
    var del=e.target.closest('.del');
    if(del){ onDelete(del); return; }
    var card=e.target.closest('.card'); if(!card) return;
    if(!pin){
      toast('도장을 찍으려면 먼저 PIN으로 잠금을 열어 주세요');
      $('pinForm').classList.add('show'); $('pinInput').focus({preventScroll:true});
      return;
    }
    var id=card.dataset.id, prev=state[id];
    var next = prev ? null : {date:today()};
    if(next) state[id]=next; else delete state[id];
    render();
    if(next){ var st=card.querySelector('.stamp'); st.classList.remove('pop'); void st.offsetWidth; st.classList.add('pop'); }
    var r = next ? await rpc('dojang_stamp',{p_pin:pin, p_id:id, p_date:next.date})
                 : await rpc('dojang_unstamp',{p_pin:pin, p_id:id});
    if(r!=='ok'){ if(prev) state[id]=prev; else delete state[id]; render(); handleFail(r); }
  });

  // ---------- delete place ----------
  var delTimer=null;
  async function onDelete(btn){
    if(!btn.classList.contains('confirming')){
      main.querySelectorAll('.del.confirming').forEach(function(b){ b.classList.remove('confirming'); b.textContent='삭제'; });
      btn.classList.add('confirming'); btn.textContent='정말 삭제?';
      clearTimeout(delTimer); delTimer=setTimeout(function(){ btn.classList.remove('confirming'); btn.textContent='삭제'; },3000);
      return;
    }
    clearTimeout(delTimer);
    var id=btn.dataset.del;
    var r=await rpc('dojang_delete_place',{p_pin:pin, p_id:id});
    if(r==='ok'){ places=places.filter(function(p){ return p.id!==id; }); delete state[id]; buildPanel(); render(); toast('삭제했어요'); }
    else handleFail(r);
  }

  // ---------- add place ----------
  $('addForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var name=$('addName').value.trim(), region=$('addRegion').value.trim(), note=$('addNote').value.trim();
    if(!name || !region) return;
    $('addBtn').disabled=true;
    var r=await rpc('dojang_add_place',{p_pin:pin, p_collection:cur.id, p_name:name, p_region:region, p_note:note});
    $('addBtn').disabled=false;
    if(r==='ok'){
      $('addName').value=''; $('addNote').value='';
      try{ await loadAll(); }catch(err){}
      buildPanel(); render(); toast('「'+name+'」 추가했어요');
    } else handleFail(r);
  });

  // ---------- reset ----------
  var resetBtn=$('resetBtn'), confirming=false, timer=null;
  function resetLabel(){ confirming=false; resetBtn.textContent='이 탭 기록 초기화'; resetBtn.classList.remove('confirming'); }
  resetBtn.addEventListener('click', async function(){
    if(!confirming){
      confirming=true; resetBtn.textContent='「'+cur.tab+'」 도장을 모두 지울까요? 다시 누르면 삭제돼요'; resetBtn.classList.add('confirming');
      timer=setTimeout(resetLabel,3000); return;
    }
    clearTimeout(timer); resetLabel();
    var ids=itemsOf(cur).map(function(it){ return it.id; });
    var r=await rpc('dojang_reset',{p_pin:pin, p_ids:ids});
    if(r==='ok'){ ids.forEach(function(id){ delete state[id]; }); render(); }
    else handleFail(r);
  });

  window.addEventListener('hashchange', function(){ select(location.hash.slice(1), false); });

  // ---------- init ----------
  async function init(){
    select(location.hash.slice(1) || lsGet(LS_TAB) || COLS[0].id, false);
    if(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase){
      try{
        sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
        await loadAll();
        $('syncStatus').textContent='이 링크에 접속한 사람과 하나의 기록을 함께 봐요';
        var refresh = async function(){ try{ await loadAll(); buildPanel(); render(); }catch(e){} };
        sb.channel('dojang-live')
          .on('postgres_changes',{event:'*',schema:'public',table:'visits'}, refresh)
          .on('postgres_changes',{event:'*',schema:'public',table:'places'}, refresh)
          .subscribe();
        var saved=lsGet(LS_PIN);
        if(saved){ var r=await rpc('dojang_verify',{p_pin:saved}); if(r==='ok') setUnlocked(saved); else setLocked(); }
      }catch(e){
        console.error(e); sb=null;
        $('syncStatus').textContent='서버에 연결하지 못했어요 — 새로고침해 주세요';
      }
    } else {
      $('syncStatus').textContent='서버에 연결하지 못했어요 — 새로고침해 주세요';
    }
    buildPanel(); render();
  }
  init();
})();
</script>
</body>
</html>
